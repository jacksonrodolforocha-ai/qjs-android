name: Compilar libqjs.so (QuickJS para Android)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o QuickJS-ng
        run: git clone --depth 1 https://github.com/quickjs-ng/quickjs.git qjs-src

      - name: Compilar para arm64 e armv7
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          for ABI in arm64-v8a armeabi-v7a; do
            cmake -S qjs-src -B build-$ABI \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release -DQJS_BUILD_LIBC=ON
            cmake --build build-$ABI --target qjs_exe -j
            mkdir -p out/jniLibs/$ABI
            cp build-$ABI/qjs out/jniLibs/$ABI/libqjs.so
            "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip out/jniLibs/$ABI/libqjs.so || true
          done
          ls -la out/jniLibs/*

      - name: Publicar o resultado
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: out/jniLibs
